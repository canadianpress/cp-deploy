name: Deploy Newsroom (Reusable)

on:
  workflow_call:
    inputs:
      TARGET_DIR:
        required: true
        type: string
      REPO_URL:
        required: true
        type: string
      REPO_REF:
        required: true
        type: string
      SSM_ENV_PARAM_NAME:
        required: true
        type: string
      TARGET_USER:
        required: false
        type: string
        default: "ubuntu"
      MAX_POLL_TIME:
        required: false
        type: string
        default: "7500"
      POLL_INTERVAL:
        required: false
        type: string
        default: "10"
    secrets:
      IAM_ROLE:
        required: true
      AWS_REGION:
        required: true
      INSTANCE_ID:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute SSM Command
        run: |
          TARGET_DIR="${{ inputs.TARGET_DIR }}"
          REPO_URL="${{ inputs.REPO_URL }}"
          REPO_REF="${{ inputs.REPO_REF }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          SSM_ENV_PARAM_NAME="${{ inputs.SSM_ENV_PARAM_NAME }}"
          TARGET_USER="${{ inputs.TARGET_USER }}"
          MAX_POLL_TIME="${{ inputs.MAX_POLL_TIME }}"
          POLL_INTERVAL="${{ inputs.POLL_INTERVAL }}"
          INSTANCE_ID="${{ inputs.INSTANCE_ID }}"

          if [[ ! "$MAX_POLL_TIME" =~ ^[1-9][0-9]*$ || ! "$POLL_INTERVAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "MAX_POLL_TIME and POLL_INTERVAL must be positive integers"
            exit 1
          fi
          MAX_ATTEMPTS=$((MAX_POLL_TIME / POLL_INTERVAL))
          if [ "$MAX_ATTEMPTS" -lt 1 ]; then
            echo "MAX_POLL_TIME must be at least POLL_INTERVAL"
            exit 1
          fi

          SSM_COMMANDS=$(cat <<EOF
            set -e
            exec 2>&1

            export AWS_DEFAULT_REGION="$AWS_REGION"

            LOCK_FILE="/var/lock/newsroom-deploy.lock"
            touch "\$LOCK_FILE"
            chown "root:\$(id -gn '$TARGET_USER')" "\$LOCK_FILE"
            chmod 660 "\$LOCK_FILE"
            exec 8>>"\$LOCK_FILE"
            flock -w 300 8 || { echo "Timed out waiting for another host deployment"; exit 1; }

            mkdir -p "$TARGET_DIR"
            chown -R "$TARGET_USER:\$(id -gn '$TARGET_USER')" "$TARGET_DIR"

            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI..."
              curl -fsSL https://awscli.amazonaws.com/v2/install.sh | sudo bash -s -- --system
            fi

            runuser -u "$TARGET_USER" -- env \
              HOME="/home/$TARGET_USER" \
              USER="$TARGET_USER" \
              LOGNAME="$TARGET_USER" \
              XDG_RUNTIME_DIR="/run/user/\$(id -u "$TARGET_USER")" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/\$(id -u "$TARGET_USER")/bus" \
              TARGET_DIR="$TARGET_DIR" \
              REPO_URL="$REPO_URL" \
              REPO_REF="$REPO_REF" \
              AWS_REGION="$AWS_REGION" \
              SSM_ENV_PARAM_NAME="$SSM_ENV_PARAM_NAME" \
              DEPLOY_LOCK_HELD=true \
              bash -c '
                set -e
                exec 2>&1

                export AWS_DEFAULT_REGION="$AWS_REGION"

                if [ -d "$TARGET_DIR/.git" ]; then
                  echo "Updating existing repository at $TARGET_DIR..."
                  cd "$TARGET_DIR"
                  git fetch --prune --tags --force origin
                  if git rev-parse -q --verify "refs/tags/${REPO_REF}" >/dev/null; then
                    echo "Checking out tag ${REPO_REF}"
                    git checkout "refs/tags/${REPO_REF}"
                  elif git rev-parse -q --verify "refs/remotes/origin/${REPO_REF}" >/dev/null; then
                    echo "Checking out branch ${REPO_REF}"
                    git checkout -B "$REPO_REF" "origin/$REPO_REF" || git checkout "$REPO_REF"
                    git reset --hard "origin/$REPO_REF"
                  else
                    echo "Checking out ${REPO_REF}"
                    git checkout "$REPO_REF" || git checkout -B "$REPO_REF" "origin/$REPO_REF"
                  fi
                else
                  echo "Cloning new repository into $TARGET_DIR..."
                  git clone "$REPO_URL" "$TARGET_DIR"
                  cd "$TARGET_DIR"
                  git fetch --prune --tags --force origin
                  if git rev-parse -q --verify "refs/tags/${REPO_REF}" >/dev/null; then
                    git checkout "refs/tags/${REPO_REF}"
                  elif git rev-parse -q --verify "refs/remotes/origin/${REPO_REF}" >/dev/null; then
                    git checkout -B "$REPO_REF" "origin/$REPO_REF"
                  else
                    git checkout "$REPO_REF"
                  fi
                fi

                echo "Current HEAD"
                git -C "$TARGET_DIR" rev-parse HEAD

                echo "Writing .env file from SSM Parameter Store..."
                aws ssm get-parameter \
                  --name "$SSM_ENV_PARAM_NAME" \
                  --with-decryption \
                  --query "Parameter.Value" \
                  --output text > "$TARGET_DIR/deploy/deploy.env"
                chmod 600 "$TARGET_DIR/deploy/deploy.env"

                cd "$TARGET_DIR/deploy/hosts"
                sudo ./setup-newsroom-system.sh

                cd "$TARGET_DIR/deploy/services"
                ./newsroom.sh
              '

          EOF
          )
          PAYLOAD=$(echo "$SSM_COMMANDS" | jq -R -s -c 'split("\n")')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 3600 \
            --parameters "{\"commands\": $PAYLOAD, \"executionTimeout\": [\"3600\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM command: $COMMAND_ID"

          STATUS="InProgress"
          ATTEMPTS=0

          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ] || [ "$STATUS" = "Cancelling" ]; do
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "Timed out waiting for SSM command"
              break
            fi
            sleep $POLL_INTERVAL
            ATTEMPTS=$((ATTEMPTS+1))
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "Deployment: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
